<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>මගේම AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:12px; }
.container { width:100%; max-width:480px; height:92vh; max-height:780px; background:#1a1a2e; border-radius:20px; box-shadow:0 25px 50px rgba(0,0,0,0.45); display:flex; flex-direction:column; overflow:hidden; border:1px solid #3a3a5a; }
.header { background:linear-gradient(90deg,#7b68ee,#6a5acd); color:white; padding:16px; text-align:center; font-size:1.25rem; font-weight:600; }
.header small { display:block; font-size:0.78rem; opacity:0.9; margin-top:3px; font-weight:400; }
.messages { flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:88%; padding:11px 15px; border-radius:16px; line-height:1.45; font-size:0.95rem; white-space:pre-wrap; }
.bot { background:#252545; color:#e8e8ff; align-self:flex-start; border-bottom-left-radius:4px; }
.user { background:linear-gradient(135deg,#7b68ee,#6a5acd); color:white; align-self:flex-end; border-bottom-right-radius:4px; }
.input-area { display:flex; padding:12px; background:#16162b; gap:8px; border-top:1px solid #2e2e4e; }
#input { flex:1; padding:13px 16px; border-radius:25px; border:1px solid #3a3a5a; background:#252545; color:white; font-size:1rem; outline:none; }
#send { width:48px; height:48px; border-radius:50%; border:none; background:linear-gradient(135deg,#7b68ee,#6a5acd); color:white; font-size:1.3rem; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <div class="header">මගේම AI <small>Simple Q&A Chatbot - Upload full index.html from zip for complete QA</small></div>
  <div class="messages" id="messages">
    <div class="msg bot">හායි! මම ඔයාගේ AI එක. ප්‍රශ්නයක් අහන්න. (Full version is in the zip file)</div>
  </div>
  <div class="input-area">
    <input type="text" id="input" placeholder="ප්‍රශ්නය ටයිප් කරන්න..." autocomplete="off">
    <button id="send">➤</button>
  </div>
</div>
<script>
const qa = {"hi": "හායි! කොහොමද?", "hello": "Hello! කොහොමද ඔයා?", "hellow": "Hello! කොහොමද?", "how are you": "මම හොඩට ඉන්නවා! ඔයා කොහොමද?", "thanks": "ස්තූතියි!", "bye": "බයි! ආයුබෝවන්!", "sri lanka": "ශ්‍රී ලංකාව දකුණු ආසියාවේ ඇති දූපත් රටක්.", "python": "Programming language එකක්.", "ai": "Artificial Intelligence - කෘතිම බුද්ධිය."};
function getAnswer(q) {
  q = q.trim().toLowerCase();
  if (qa[q]) return qa[q];
  for (const [k,v] of Object.entries(qa)) if (k.toLowerCase().includes(q) || q.includes(k.toLowerCase())) return v;
  return "මට ඒ ගැන තොරතුරු නැහැ. Full version එක zip එකෙන් download කරන්න.";
}
const messages = document.getElementById("messages");
const input = document.getElementById("input");
function addMsg(t, w) { const d=document.createElement("div"); d.className="msg "+w; d.textContent=t; messages.appendChild(d); messages.scrollTop=messages.scrollHeight; }
function send() { const t=input.value.trim(); if(!t)return; addMsg(t,"user"); input.value=""; setTimeout(()=>addMsg(getAnswer(t),"bot"),300); }
document.getElementById("send").onclick=send;
input.addEventListener("keypress",e=>{if(e.key==="Enter")send();});
input.focus();
</script>
</body>
</html>
